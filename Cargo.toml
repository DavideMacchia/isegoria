[workspace]
resolver = "2"
members = ["crates/scoring", "crates/identity", "crates/network", "crates/protocol"]

[workspace.package]
edition = "2021"
license = "EUPL-1.2"
rust-version = "1.86"

# Release profile favoring reproducibility of the scoring engine (CLAUDE.md #7).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Mutation testing (docs/11): the test profile, optimized. The scoring tests (mixture
# fits, the 8-start bridging fit, golden outputs) dominate each mutant's run and are
# several times faster at opt-level 3. Overflow checks and debug assertions stay on, so a
# mutant that overflows still panics; Rust does no fast-math, so results are the same bits
# (the golden test runs under this profile too).
[profile.mutants]
inherits = "test"
opt-level = 3
debug = false

# The scoring engine is numerically heavy (the latent-class DIF fits thousands of
# respondents per candidate model), and unoptimized it made the test suite take minutes.
# Optimize it in dev/test builds too; there is no fast-math, so results are the same bits
# (the golden test checks it).
[profile.dev.package.scoring]
opt-level = 3
