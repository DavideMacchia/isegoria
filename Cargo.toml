[workspace]
resolver = "2"
members = [
    "crates/scoring",
    "crates/identity",
    "crates/network",
    "crates/protocol",
    "crates/characterization",
]

[workspace.package]
edition = "2021"
license = "EUPL-1.2"
rust-version = "1.86"

# Release profile favoring reproducibility of the scoring engine (CLAUDE.md #7).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Mutation testing (docs/11): the test profile, optimized. The scoring tests (mixture
# fits, the 8-start bridging fit, golden outputs) dominate each mutant's run and are
# several times faster at opt-level 3. Overflow checks and debug assertions stay on, so a
# mutant that overflows still panics; Rust does no fast-math, so results are the same bits
# (the golden test runs under this profile too).
[profile.mutants]
inherits = "test"
opt-level = 3
debug = false

# The scoring engine is numerically heavy (the latent-class DIF fits thousands of
# respondents per candidate model), and unoptimized it made the test suite take minutes.
# Optimize it in dev/test builds too; there is no fast-math, so results are the same bits
# (the golden test checks it).
[profile.dev.package.scoring]
opt-level = 3

# `libm` carries the engine's transcendental functions (AT-BR-04); unoptimized it makes
# the scoring tests several times slower. Same bits at any opt-level (no fast-math).
[profile.dev.package.libm]
opt-level = 3

# The identity proofs (BBS+ over BLS12-381) are pairing arithmetic, and unoptimized a
# proof costs ~100 ms — an end-to-end epoch that admits every respondent through the
# identity gate (T65) would take minutes. Optimize `identity` in dev/test builds too.
[profile.dev.package.identity]
opt-level = 3
