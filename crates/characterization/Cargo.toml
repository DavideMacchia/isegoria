[package]
name = "characterization"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The T24 characterization harness: seeded, resumable, parallel simulation studies of the production detectors and gates. Not part of a node. See docs/13."

[dependencies]
scoring = { path = "../scoring" }
protocol = { path = "../protocol" }
rand = "0.8"
rand_chacha = "0.3"
# The generators' transcendental functions, as the engine's (`scoring::fmath`): the same
# datasets on every platform, so any run reproduces from its seed anywhere (docs/13 §2).
libm = "0.2"
sha2 = "0.10"

[dev-dependencies]
identity = { path = "../identity" }
