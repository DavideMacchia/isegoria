[package]
name = "identity"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Anonymous enrollment: source adapters, threshold-issued credential, role nullifiers. See docs/03."

# Use mature crypto libraries; never roll our own (docs/CLAUDE.md). Heavy primitives
# (BBS+ blind issuance, Semaphore nullifiers) enter behind traits; the uniqueness
# label is a real single-server VOPRF (RFC 9497) via `voprf`, threshold key = future.
[dependencies]
sha2 = "0.10"
# RFC 9497 (V)OPRF, Ristretto255-SHA512. MIT/Apache-2.0, MSRV 1.85. See docs/03 §M1.
voprf = { version = "0.5.0", features = ["ristretto255"] }
# OsRng for the VOPRF blinding factor / proof nonce (rand_core 0.6, matching voprf).
rand_core = { version = "0.6", features = ["getrandom"] }

# Integration tests reach for the raw voprf API to assert the protocol-level
# properties (obliviousness, verifiability) that VoprfOracle relies on.
[dev-dependencies]
voprf = { version = "0.5.0", features = ["ristretto255"] }
rand_core = { version = "0.6", features = ["getrandom"] }
