[package]
name = "identity"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Anonymous enrollment: source adapters, threshold-issued credential, role nullifiers. See docs/03."

# Prefer mature crypto libraries; bespoke crypto only as a tested exception (docs/CLAUDE.md).
# Real backends are single-party; the threshold t-of-n split across the committee is future work.
[dependencies]
sha2 = "0.10"
# RFC 9497 (V)OPRF, Ristretto255-SHA512. MIT/Apache-2.0, MSRV 1.85. See docs/03 §M1.
voprf = { version = "0.5.0", features = ["ristretto255"] }
# OsRng for the VOPRF blind / BBS+ nonces (rand_core 0.6, matching voprf and arkworks).
rand_core = { version = "0.6", features = ["getrandom"] }
# BBS+ blind signatures for the anonymous credential (Apache-2.0). See docs/03 §M2.
bbs_plus = "0.25"
# Schnorr PoK so the issuer verifies the holder knows the committed secret (Apache-2.0).
schnorr_pok = "0.23"
# arkworks curve + traits that bbs_plus / schnorr_pok are generic over (BLS12-381).
ark-bls12-381 = "0.4"
ark-ec = "0.4"
ark-ff = "0.4"
ark-std = "0.4"
ark-serialize = "0.4"
# Ristretto group for the bespoke threshold OPRF (docs/03 §M1). BSD-3-Clause.
# A vetted group primitive; the threshold DH-OPRF composed on it is our own (allowed
# as a tested exception, see docs/CLAUDE.md), not RFC 9497 wire-compatible with voprf.
curve25519-dalek = { version = "4", features = ["digest"] }

# Integration tests reach for the raw voprf API to assert the protocol-level
# properties (obliviousness, verifiability) that VoprfOracle relies on.
[dev-dependencies]
voprf = { version = "0.5.0", features = ["ristretto255"] }
rand_core = { version = "0.6", features = ["getrandom"] }
