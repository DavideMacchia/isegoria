[package]
name = "scoring"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Deterministic, reproducible scoring engine: Level A (bridging), Level B (IRT/DIF), Level C (reputation). No dependency on identity or network."

[features]
# Attribute-based (Variant-1) DIF: needs a per-respondent `group`, so calibration-only
# (docs/01 D20). Off by default; production compiles no `group`-taking path.
calibration = []

# Offline crate (CLAUDE.md #7): do not add dependencies on identity/network/protocol
# or on I/O or network libraries here. Deterministic math only.
[dependencies]
rand = "0.8"
rand_chacha = "0.3"

[dev-dependencies]
# Property tests over arbitrary rating matrices, weights and scores (T42).
proptest = "1"
