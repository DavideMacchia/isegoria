[package]
name = "protocol"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Question lifecycle orchestration: deposit, lottery, blind review, bridging gate, appeal, two-stage pilot, honeypot. See docs/05."

[features]
# Attribute-based (Variant-1) DIF on the production path — `pilot::stage2_dif` and
# `revalidation::revalidate_pool` — is calibration-only (docs/01 D20). Enabling it pulls
# in scoring's gated Variant-1 API. Off by default; the production epoch uses Variant 2.
calibration = ["scoring/calibration"]

[dependencies]
scoring = { path = "../scoring" }
identity = { path = "../identity" }
network = { path = "../network" }
rand = "0.8"
rand_chacha = "0.3"
sha2 = "0.10"

[dev-dependencies]
proptest = "1"
