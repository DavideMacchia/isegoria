name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reads the pinned channel from rust-toolchain.toml and caches the build.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      # Pinned Python env so the fixture-drift guard regenerates the oracle and
      # compares it for real on every push (T4 / REPRO-003; see sim/requirements.txt).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install sim dependencies
        run: pip install -r sim/requirements.txt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Calibration-only, attribute-based DIF (Variant 1, D20/T32) must also stay green.
      - name: Clippy (calibration)
        run: cargo clippy --workspace --all-targets --features calibration -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Test (calibration)
        run: cargo test --workspace --features calibration

  # AT-BR-04 (docs/08 INV-7, REPRO-001): every value the engine returns on the fixture
  # datasets is pinned bit for bit in crates/scoring/tests/fixtures/golden_bits.txt by
  # the `golden` test. The main job checks it on linux-gnu in the dev profile; this job
  # checks the same bits on the other platforms and in the release profile, so a
  # divergence between two signers' machines cannot go unnoticed.
  golden:
    name: golden bits (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gnu, release profile
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            args: --release
          - name: linux-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            args: ""
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            args: ""
          - name: windows-msvc
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - name: Golden bits
        run: cargo test -p scoring --test golden --target ${{ matrix.target }} ${{ matrix.args }}

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage summary
        run: cargo llvm-cov --workspace --summary-only
      - name: Coverage report (lcov)
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
